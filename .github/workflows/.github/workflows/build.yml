name: Build Android APK (Capacitor Fix)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize App Project
      run: |
        # Создаем базовый package.json, без которого Capacitor падал!
        echo '{"name": "mayumshka-game","version": "2.0.0"}' > package.json
        
        # Устанавливаем Capacitor
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # Инициализируем проект с уникальным ID Главы 2
        npx cap init "MayUmshka2" "com.myrunplay.mayumsyka2" --web-dir=www --no-interactive
        npx cap add android

    - name: Sync Web Code and Audio
      run: |
        npx cap sync

    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Optimize and Sign APK via apksigner (V2/V3)
      run: |
        # 1. Генерируем цифровой паспорт автора
        keytool -genkey -v -keystore my-release-key.jks -alias game_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass mysecretpassword123 -keypass mysecretpassword123 -dname "CN=MayUmshka2, O=Developer, C=RU"
        
        # 2. Находим собранный Capacitor-ом файл
        ORIGINAL_APK=$(find android/app/build/outputs/apk/release/ -name "*unsigned*.apk" | head -n 1)
        ZIPALIGN_PATH=$(find /usr/local/lib/android/sdk/build-tools/ -name "zipalign" | sort -V | tail -n 1)
        APKSIGNER_PATH=$(find /usr/local/lib/android/sdk/build-tools/ -name "apksigner" | sort -V | tail -n 1)
        
        # 3. Выравниваем байты (Убирает ошибку "Что-то пошло не так" в RuStore)
        $ZIPALIGN_PATH -v 4 $ORIGINAL_APK ./aligned.apk
        
        # 4. Подписываем по схемам V2 и V3
        $APKSIGNER_PATH sign --ks my-release-key.jks --ks-key-alias game_alias --ks-pass pass:mysecretpassword123 --key-pass pass:mysecretpassword123 --out ./MayUmshka2_Final_Fixed.apk ./aligned.apk

    - name: Upload Finished Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: RuStore-Ready-APK
        path: MayUmshka2_Final_Fixed.apk
