name: Build Android APK (Chapter 2 Final Fixed)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create cordova_app com.myrunplay.mayumsyka2 MayUmshka2
        rm -rf cordova_app/www/*
        cp -R www/* cordova_app/www/
        cd cordova_app
        
        # Добавляем плагины, которые заставят Android воспроизводить музыку из папки www БЕЗ изменения HTML кода!
        cordova plugin add cordova-plugin-file --no-telemetry
        cordova plugin add cordova-plugin-media --no-telemetry
        
        cordova platform add android --no-telemetry
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Build Android Release APK
      run: |
        cd cordova_app
        cordova build android --release --no-telemetry -- --packageType=apk --versionCode=2 --versionName=2.0.0
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Optimize and Sign APK via apksigner
      run: |
        # 1. Генерируем ключ автора
        keytool -genkey -v -keystore my-release-key.jks -alias game_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass mysecretpassword123 -keypass mysecretpassword123 -dname "CN=MayUmshka2, O=Developer, C=RU"
        
        # 2. Находим исходный APK и утилиты Android SDK
        ORIGINAL_APK=$(find cordova_app/platforms/android/app/build/outputs/apk/ -name "*release*.apk" | head -n 1)
        ZIPALIGN_PATH=$(find /usr/local/lib/android/sdk/build-tools/ -name "zipalign" | sort -V | tail -n 1)
        APKSIGNER_PATH=$(find /usr/local/lib/android/sdk/build-tools/ -name "apksigner" | sort -V | tail -n 1)
        
        # 3. Выравниваем байты (Оптимизация для RuStore)
        $ZIPALIGN_PATH -v 4 $ORIGINAL_APK ./aligned.apk
        
        # 4. Подписываем выровненный файл по схемам V2/V3
        $APKSIGNER_PATH sign --ks my-release-key.jks --ks-key-alias game_alias --ks-pass pass:mysecretpassword123 --key-pass pass:mysecretpassword123 --out ./MayUmshka2_Final_Release.apk ./aligned.apk

    - name: Upload Finished Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: RuStore-Ready-APK
        path: MayUmshka2_Final_Release.apk
