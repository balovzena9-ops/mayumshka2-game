name: Build Android APK (Capacitor Audio Fix)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize Capacitor App
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        # Инициализируем проект строго под ID Главы 2 без вопросов к терминалу
        npx cap init "MayUmshka2" "com.myrunplay.mayumsyka2" --web-dir=www --no-interactive
        npx cap add android

    - name: Sync Game and Audio Files
      run: |
        npx cap sync

    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Optimize and Sign APK via apksigner (V2/V3)
      run: |
        # 1. Генерируем ключ автора
        keytool -genkey -v -keystore my-release-key.jks -alias game_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass mysecretpassword123 -keypass mysecretpassword123 -dname "CN=MayUmshka2, O=Developer, C=RU"
        
        # 2. Находим исходный релизный APK и утилиты Android SDK
        ORIGINAL_APK=$(find android/app/build/outputs/apk/release/ -name "*unsigned*.apk" | head -n 1)
        ZIPALIGN_PATH=$(find /usr/local/lib/android/sdk/build-tools/ -name "zipalign" | sort -V | tail -n 1)
        APKSIGNER_PATH=$(find /usr/local/lib/android/sdk/build-tools/ -name "apksigner" | sort -V | tail -n 1)
        
        # 3. Выравниваем байты (Оптимизация zipalign, чтобы ушла ошибка RuStore)
        $ZIPALIGN_PATH -v 4 $ORIGINAL_APK ./aligned.apk
        
        # 4. Подписываем выровненный файл правильным apksigner
        $APKSIGNER_PATH sign --ks my-release-key.jks --ks-key-alias game_alias --ks-pass pass:mysecretpassword123 --key-pass pass:mysecretpassword123 --out ./MayUmshka2_Final_Fixed.apk ./aligned.apk

    - name: Upload Finished Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: RuStore-Ready-APK
        path: MayUmshka2_Final_Fixed.apk
